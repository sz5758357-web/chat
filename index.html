<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mini Browser</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="browser-header">

        <div class="tabs-bar">

            <div id="tabs"></div>

            <button
                id="newTab"
                class="new-tab"
                title="Nowa karta"
            >
                +
            </button>

        </div>

        <div class="toolbar">

            <button id="back" title="Wstecz">
                ←
            </button>

            <button id="forward" title="Dalej">
                →
            </button>

            <button id="reload" title="Odśwież">
                ↻
            </button>

            <button id="home" title="Strona główna">
                ⌂
            </button>

            <div class="address-wrapper">

                <span class="security">
                    🔒
                </span>

                <input
                    id="address"
                    type="text"
                    spellcheck="false"
                    autocomplete="off"
                    placeholder="Wpisz adres lub wyszukaj..."
                >

            </div>

            <button id="go" title="Przejdź">
                →
            </button>

        </div>

    </header>

    <div id="loadingBar"></div>

    <script src="renderer.js"></script>

</body>

</html>
